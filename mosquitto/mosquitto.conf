# Mosquitto 2.x - broker MQTT de CampusSense
listener 1883
allow_anonymous false
password_file /mosquitto/data/passwd
# el usuario del ESP32 solo puede tocar sus propios topicos
acl_file /mosquitto/data/acl

# sesiones persistentes y QoS 1 sobreviven a un reinicio
persistence true
persistence_location /mosquitto/data/
autosave_interval 60
max_queued_messages 2000

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
